# Hot-reload overlay for compose.yaml, used by ./dev.sh start.
# The orchestrator runs from source (golang image); dev/go-hot.sh rebuilds
# and restarts it on changes. The web UI with hot reload is served by the
# Vite dev server on the host (port 18484), which forwards /api and /login
# to the orchestrator.
services:
  orchestrator:
    build: !reset null
    image: golang:1.26-bookworm
    working_dir: /src
    entrypoint: ["/src/dev/go-hot.sh"]
    volumes:
      - ./:/src:ro
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build

volumes:
  gomod: { name: agwpoc_gomod }
  gocache: { name: agwpoc_gocache }
