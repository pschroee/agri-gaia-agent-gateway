# PoC stage 1: orchestrator, Postgres, RustFS and the package caches. The sandboxes are started by the
# orchestrator itself through the Docker API; they do not belong to this project.
# Start with ./dev.sh start (builds the agw-basis image first).
name: agwpoc

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agwpoc
      POSTGRES_DB: agwpoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg:/var/lib/postgresql/data
    networks: [intern]
    ports:
      - "127.0.0.1:${AGW_PG_PORT:-18482}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agwpoc -d agwpoc"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs@sha256:fa19210ac4697c79d7ccca1ec9b0eb91aebacc6691991ffb14014bb3c67e6cc3
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      RUSTFS_OBS_LOGGER_LEVEL: warn
    security_opt: ["no-new-privileges:true"]
    volumes:
      - s3:/data
    networks: [intern]
    ports:
      - "127.0.0.1:${AGW_S3_CONSOLE_PORT:-18483}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # Package caches for npm and pip. They are only attached to the network pkg (with
  # internet, no route to Postgres, RustFS or the orchestrator). A sandbox
  # reaches them only while its chat has internet: the orchestrator then attaches
  # them under the aliases npm-cache and pip-cache to the sandbox's slot network
  # and detaches them when internet is switched off (AGW_NPM_CACHE, AGW_PIP_CACHE;
  # container names from Compose). No ports on the host.
  npm-cache:
    image: verdaccio/verdaccio:6.10.4@sha256:43c4067288b050422265407ea2fe747e511fcd0c407a85ec90ab9a326d9400cd
    volumes:
      - npmcache:/verdaccio/storage
      - ./pkgcache/verdaccio.yaml:/verdaccio/conf/config.yaml:ro
    networks: [pkg]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4873/-/ping >/dev/null"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

  pip-cache:
    image: epicwink/proxpi:1.3.0@sha256:0748b92ddf75405d9d83fbd1705517f951e67e0540af86e0a9bf4de388ba86c0
    environment:
      PROXPI_CACHE_DIR: /var/cache/proxpi
      PROXPI_CACHE_SIZE: "10000000000" # 10 GB, beyond that proxpi evicts rarely used files
      # The default is 0.9 s: if the download takes longer, proxpi redirects pip to
      # files.pythonhosted.org, and the file would bypass the cache.
      PROXPI_DOWNLOAD_TIMEOUT: "120"
      PROXPI_CONNECT_TIMEOUT: "10"
      PROXPI_READ_TIMEOUT: "60"
    volumes:
      - pipcache:/var/cache/proxpi
    networks: [pkg]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=2)"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

  # Own metasearch engine for web_search (pi-searxng-suite). Only the orchestrator reaches it
  # (network search); pi queries through the orchestrator's web proxy, and only when its chat
  # has internet. SearXNG itself needs internet for the search engines. No port on the host.
  searxng:
    image: searxng/searxng:2026.9.30-a9d990033@sha256:a07a5cd2da2c63d66e559f9e4d3a3db106cfc6c32fb0ac70abe91cc28bcd7350
    user: "977:977"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env (./dev.sh creates it)}
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    tmpfs:
      - /var/cache/searxng:uid=977,gid=977
      - /tmp
    networks: [search]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: agwpoc/orchestrator:dev
    env_file: .env
    environment:
      AGW_DATABASE_URL: postgres://agwpoc:${POSTGRES_PASSWORD}@postgres:5432/agwpoc?sslmode=disable
      AGW_S3_ENDPOINT: rustfs:9000
      AGW_CATALOG: /etc/agw/models.json
      AGW_IMAGE: ${AGW_IMAGE:-agwpoc/agw-basis:dev}
      AGW_PI_IMAGE: ${AGW_PI_IMAGE:-agwpoc/agw-pi:dev}
      AGW_EGRESS_NETWORK: agwpoc_egress
      AGW_EGRESS_SUBNET: 10.231.20.0/24
      AGW_SOCKET_VOLUME: agwpoc_sockets
      AGW_SOCKET_ROOT: /run/agw
      AGW_PROXY_BASE_URL: http://orchestrator:18481
      AGW_BLOCKED_SUBNETS: 10.231.20.0/24,10.231.21.0/24,10.231.22.0/24,10.231.128.0/17
      AGW_SEARXNG_URL: http://searxng:8080
      AGW_NPM_CACHE: agwpoc-npm-cache-1
      AGW_PIP_CACHE: agwpoc-pip-cache-1
      AGW_POOL_SIZE_CLI: ${AGW_POOL_SIZE_CLI:-1}
      AGW_POOL_SIZE_MCP: ${AGW_POOL_SIZE_MCP:-1}
      AGW_COMPACT_RESERVE_TOKENS: ${AGW_COMPACT_RESERVE_TOKENS:-16384}
      AGW_COMPACT_KEEP_RECENT_TOKENS: ${AGW_COMPACT_KEEP_RECENT_TOKENS:-20000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sockets:/run/agw
      - ./models.json:/etc/agw/models.json:ro
    networks:
      intern: {}
      search: {}
    ports:
      - "127.0.0.1:${AGW_HTTP_PORT:-18480}:18480"
    depends_on:
      postgres: { condition: service_healthy }
      rustfs: { condition: service_healthy }
      # Only started, not healthy: the caches are dispensable; without them
      # installations fail, everything else keeps running.
      npm-cache: { condition: service_started }
      pip-cache: { condition: service_started }
      searxng: { condition: service_started }
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  pg: { name: agwpoc_pg }
  s3: { name: agwpoc_s3 }
  sockets: { name: agwpoc_sockets }
  npmcache: { name: agwpoc_npmcache }
  pipcache: { name: agwpoc_pipcache }

networks:
  intern:
    name: agwpoc_intern
    ipam: { config: [{ subnet: 10.231.18.0/24 }] }
  # SearXNG and orchestrator; SearXNG reaches the internet through this. No sandbox is attached.
  search:
    name: agwpoc_search
    ipam: { config: [{ subnet: 10.231.22.0/24 }] }
  # Egress of the package caches to the internet. No sandbox is attached;
  # without ICC the two caches cannot reach each other either.
  pkg:
    name: agwpoc_pkg
    driver_opts: { com.docker.network.bridge.enable_icc: "false" }
    ipam: { config: [{ subnet: 10.231.21.0/24 }] }
# The orchestrator creates further networks itself:
# - agwpoc_slot_<slot> (internal, /28 from 10.231.128.0/17): one network per slot
#   with exactly two members, sandbox and orchestrator (alias
#   "orchestrator", for the LLM proxy). Sandboxes cannot reach each other.
# - agwpoc_egress (10.231.20.0/24, without ICC): internet; a sandbox is attached
#   only when the chat has internet. The orchestrator is not attached.
#   Without ICC a sandbox there reaches no other containers; that is why the
#   package caches are not attached here but are attached to the sandbox's
#   slot network when internet is on (see npm-cache).
