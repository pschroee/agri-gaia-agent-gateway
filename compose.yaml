# PoC Stufe 1: Orchestrator, Postgres, RustFS und die Paket-Zwischenspeicher. Die Sandboxen startet der
# Orchestrator selbst über die Docker-API; sie gehören nicht zu diesem Projekt.
# Starten über ./dev.sh start (baut vorher das Abbild agw-basis).
name: agwpoc

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agwpoc
      POSTGRES_DB: agwpoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    volumes:
      - pg:/var/lib/postgresql/data
    networks: [intern]
    ports:
      - "127.0.0.1:${AGW_PG_PORT:-18482}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agwpoc -d agwpoc"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs@sha256:fa19210ac4697c79d7ccca1ec9b0eb91aebacc6691991ffb14014bb3c67e6cc3
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY in .env setzen}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY in .env setzen}
      RUSTFS_OBS_LOGGER_LEVEL: warn
    security_opt: ["no-new-privileges:true"]
    volumes:
      - s3:/data
    networks: [intern]
    ports:
      - "127.0.0.1:${AGW_S3_CONSOLE_PORT:-18483}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # Paket-Zwischenspeicher für npm und pip. Sie hängen nur am Netz pkg (mit
  # Internet, ohne Weg zu Postgres, RustFS oder dem Orchestrator). Eine Sandbox
  # erreicht sie nur, solange ihr Chat Internet hat: Der Orchestrator hängt sie
  # dann unter den Aliasen npm-cache und pip-cache an das Platz-Netz der Sandbox
  # und beim Abschalten wieder ab (AGW_NPM_CACHE, AGW_PIP_CACHE; Container-Namen
  # von Compose). Keine Ports am Host.
  npm-cache:
    image: verdaccio/verdaccio:6.10.4@sha256:43c4067288b050422265407ea2fe747e511fcd0c407a85ec90ab9a326d9400cd
    volumes:
      - npmcache:/verdaccio/storage
      - ./pkgcache/verdaccio.yaml:/verdaccio/conf/config.yaml:ro
    networks: [pkg]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4873/-/ping >/dev/null"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

  pip-cache:
    image: epicwink/proxpi:1.3.0@sha256:0748b92ddf75405d9d83fbd1705517f951e67e0540af86e0a9bf4de388ba86c0
    environment:
      PROXPI_CACHE_DIR: /var/cache/proxpi
      PROXPI_CACHE_SIZE: "10000000000" # 10 GB, danach verdrängt proxpi selten genutzte Dateien
      # Standard sind 0,9 s: Dauert der Abruf länger, leitet proxpi pip zu
      # files.pythonhosted.org um, und die Datei käme am Zwischenspeicher vorbei.
      PROXPI_DOWNLOAD_TIMEOUT: "120"
      PROXPI_CONNECT_TIMEOUT: "10"
      PROXPI_READ_TIMEOUT: "60"
    volumes:
      - pipcache:/var/cache/proxpi
    networks: [pkg]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=2)"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

  # Eigene Metasuchmaschine für web_search (pi-searxng-suite). Nur der Orchestrator erreicht sie
  # (Netz search); pi fragt über den Web-Proxy des Orchestrators an, und das nur, wenn sein Chat
  # Internet hat. SearXNG selbst braucht Internet für die Suchmaschinen. Kein Port am Host.
  searxng:
    image: searxng/searxng:2026.9.30-a9d990033@sha256:a07a5cd2da2c63d66e559f9e4d3a3db106cfc6c32fb0ac70abe91cc28bcd7350
    user: "977:977"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET in .env setzen (./dev.sh legt ihn an)}
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    tmpfs:
      - /var/cache/searxng:uid=977,gid=977
      - /tmp
    networks: [search]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: agwpoc/orchestrator:dev
    env_file: .env
    environment:
      AGW_DATABASE_URL: postgres://agwpoc:${POSTGRES_PASSWORD}@postgres:5432/agwpoc?sslmode=disable
      AGW_S3_ENDPOINT: rustfs:9000
      AGW_CATALOG: /etc/agw/models.json
      AGW_IMAGE: ${AGW_IMAGE:-agwpoc/agw-basis:dev}
      AGW_PI_IMAGE: ${AGW_PI_IMAGE:-agwpoc/agw-pi:dev}
      AGW_EGRESS_NETWORK: agwpoc_egress
      AGW_EGRESS_SUBNET: 10.231.20.0/24
      AGW_SOCKET_VOLUME: agwpoc_sockets
      AGW_SOCKET_ROOT: /run/agw
      AGW_PROXY_BASE_URL: http://orchestrator:18481
      AGW_BLOCKED_SUBNETS: 10.231.20.0/24,10.231.21.0/24,10.231.22.0/24,10.231.128.0/17
      AGW_SEARXNG_URL: http://searxng:8080
      AGW_NPM_CACHE: agwpoc-npm-cache-1
      AGW_PIP_CACHE: agwpoc-pip-cache-1
      AGW_POOL_SIZE_CLI: ${AGW_POOL_SIZE_CLI:-1}
      AGW_POOL_SIZE_MCP: ${AGW_POOL_SIZE_MCP:-1}
      AGW_COMPACT_RESERVE_TOKENS: ${AGW_COMPACT_RESERVE_TOKENS:-16384}
      AGW_COMPACT_KEEP_RECENT_TOKENS: ${AGW_COMPACT_KEEP_RECENT_TOKENS:-20000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sockets:/run/agw
      - ./models.json:/etc/agw/models.json:ro
    networks:
      intern: {}
      search: {}
    ports:
      - "127.0.0.1:${AGW_HTTP_PORT:-18480}:18480"
    depends_on:
      postgres: { condition: service_healthy }
      rustfs: { condition: service_healthy }
      # Nur gestartet, nicht gesund: Die Zwischenspeicher sind entbehrlich, ohne
      # sie scheitern Installationen, der Rest läuft weiter.
      npm-cache: { condition: service_started }
      pip-cache: { condition: service_started }
      searxng: { condition: service_started }
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  pg: { name: agwpoc_pg }
  s3: { name: agwpoc_s3 }
  sockets: { name: agwpoc_sockets }
  npmcache: { name: agwpoc_npmcache }
  pipcache: { name: agwpoc_pipcache }

networks:
  intern:
    name: agwpoc_intern
    ipam: { config: [{ subnet: 10.231.18.0/24 }] }
  # SearXNG und Orchestrator; SearXNG geht hierüber ins Internet. Keine Sandbox hängt daran.
  search:
    name: agwpoc_search
    ipam: { config: [{ subnet: 10.231.22.0/24 }] }
  # Ausgang der Paket-Zwischenspeicher ins Internet. Keine Sandbox hängt daran;
  # ohne ICC erreichen sich auch die beiden Zwischenspeicher nicht.
  pkg:
    name: agwpoc_pkg
    driver_opts: { com.docker.network.bridge.enable_icc: "false" }
    ipam: { config: [{ subnet: 10.231.21.0/24 }] }
# Weitere Netze legt der Orchestrator selbst an:
# - agwpoc_slot_<platz> (intern, /28 aus 10.231.128.0/17): je Platz ein eigenes
#   Netz mit genau zwei Teilnehmern, Sandbox und Orchestrator (Alias
#   "orchestrator", für den LLM-Proxy). Sandboxen erreichen sich nicht.
# - agwpoc_egress (10.231.20.0/24, ohne ICC): Internet; eine Sandbox hängt nur
#   daran, wenn der Chat Internet hat. Der Orchestrator hängt nicht daran.
#   Ohne ICC erreicht eine Sandbox dort keine anderen Container; deshalb hängen
#   die Paket-Zwischenspeicher nicht hier, sondern werden bei Internet an das
#   Platz-Netz der Sandbox gehängt (siehe npm-cache).
