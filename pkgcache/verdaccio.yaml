# Verdaccio as a pure cache for npm (service npm-cache in compose.yaml).
# The sandboxes reach it only while their chat has internet (see docs/design.md,
# "Package cache (npm, pip)"). It is read-only: nobody can log in or publish,
# otherwise an agent could plant packages for other chats.
storage: /verdaccio/storage/data
plugins: /verdaccio/plugins

# No web interface: less attack surface; inspecting works through the API.
web:
  enable: false

auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    # -1 disables registering new users (npm adduser fails).
    max_users: -1

uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    timeout: 30s
    maxage: 10m
    cache: true

# "agwpoc-nobody" is a group that does not exist: publishing and
# unpublishing are thus blocked for everyone, including logged-in users.
packages:
  '@*/*':
    access: $all
    publish: agwpoc-nobody
    unpublish: agwpoc-nobody
    proxy: npmjs
  '**':
    access: $all
    publish: agwpoc-nobody
    unpublish: agwpoc-nobody
    proxy: npmjs

server:
  keepAliveTimeout: 60

# npm install asks for security advisories; Verdaccio forwards that to npmjs.
middlewares:
  audit:
    enabled: true

log:
  type: stdout
  format: pretty
  level: http
