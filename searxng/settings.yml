# SearXNG of the PoC: only for the orchestrator's web proxy (web_search from pi-searxng-suite).
# No port on the host; reachable only in the network agwpoc_search. The secret key is set by
# SEARXNG_SECRET from .env (created by ./dev.sh).
use_default_settings: true

general:
  instance_name: "agwpoc"
  enable_metrics: false

server:
  secret_key: "replaced-by-SEARXNG_SECRET"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

outgoing:
  request_timeout: 5.0
  max_request_timeout: 15.0
